name: Retrain

on:
  schedule:
    - cron: "0 3 * * 1"      # every Monday, 03:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Retrain even if no drift is found"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install (same pinned versions as the API image)
        run: |
          pip install -r requirements-api.txt
          pip install -c requirements-api.txt imbalanced-learn pymongo certifi python-dotenv mlflow

      - name: Check drift and retrain
        id: retrain
        env:
          MONGO_DB_URL: ${{ secrets.MONGO_DB_URL }}
        run: python -m fraud.pipeline.retrain_pipeline ${{ inputs.force && '--force' || '' }}

      - name: Commit the new model
        if: steps.retrain.outputs.promoted == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add artifacts/model reports
          git commit -m "Auto-retrain: new model promoted"
          git push

      - name: Trigger image build
        if: steps.retrain.outputs.promoted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run main.yml --ref main